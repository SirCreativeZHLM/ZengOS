# Used by the installer (pacstrap -C): Arch's repositories plus the ZengOS packages on this ISO.
[options]
HoldPkg = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[zengos]
SigLevel = Optional TrustAll
Server = file:///opt/zengos-repo

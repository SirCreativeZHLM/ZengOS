name: Build ISO

# Builds ZengOS in an Arch Linux container on GitHub's runners, so nobody needs a
# local VM. The built ISOs are workflow artifacts; releases are published by hand
# with `gh release create` after the ISOs have been boot-tested.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s installer/tests -v

  iso:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        edition: [normal, mini]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - run: pacman -Syu --noconfirm git sudo
      - uses: actions/checkout@v4
      - run: iso/build.sh ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: zengos-${{ matrix.edition }}
          path: out/*

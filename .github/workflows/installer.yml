name: Installer

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s installer/tests -v
  build-ui:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm cmake ninja gcc qt6-declarative qt6-wayland inter-font git
      - uses: actions/checkout@v4
      - run: cmake -S installer -B build -G Ninja && cmake --build build
      - name: Render every page offscreen on Linux
        run: |
          mkdir -p shots
          for p in 0 1 2 3 4; do QT_QPA_PLATFORM=offscreen ./build/zengos-installer --screenshot shots/page-$p.png --page $p; done
          ls -l shots
      - uses: actions/upload-artifact@v4
        with:
          name: installer-screens
          path: shots/*
